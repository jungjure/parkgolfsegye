<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

<style>
.nv{margin:6px 0 22px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.nv-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.nv-top h2{margin:0;font-size:19px}
.nv-yt{display:inline-block;padding:6px 12px;border-radius:8px;background:#e62117;color:#fff;font-weight:700;text-decoration:none;font-size:13px}
.nv-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:start}
.nv-player{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden}
.nv-player iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.nv-now{font-weight:700;font-size:16px;line-height:1.4;margin:8px 0 0}
.nv-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:360px;overflow:auto}
.nv-item{display:flex;gap:10px;align-items:flex-start;padding:6px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff}
.nv-item:hover,.nv-item.on{border-color:var(--main);background:#f1f8f4}
.nv-item img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;flex:none;background:#ddd}
.nv-d{display:inline-block;background:var(--main);color:#fff;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:700;margin-bottom:4px}
.nv-t{font-size:14px;font-weight:600;line-height:1.4}
@media (max-width:760px){.nv-grid{grid-template-columns:1fr}.nv-list{max-height:none}.nv-item img{width:110px}}
</style>
</head>
<body data-page="news" data-root="">
<div id="site-header"></div>
<main class="wrap">
  <h1>뉴스</h1>
  <section class="nv" id="nv" hidden>
    <div class="nv-top"><h2>오늘일정 뉴스 영상</h2><a class="nv-yt" href="https://www.youtube.com/playlist?list=PLbEt1lRSDZME">유튜브에서 보기</a></div>
    <div class="nv-grid">
      <div><div class="nv-player"><iframe id="nv-frame" title="오늘일정 뉴스 영상" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="nv-now" id="nv-now"></div></div>
      <ul class="nv-list" id="nv-list"></ul>
    </div>
  </section>
  <div id="news"></div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=20261124m"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js?v=20261127s"></script>
<script src="assets/js/navi.js?v=20261125s"></script>
<script src="assets/js/news.js?v=20261127a"></script>
<script>
// 오늘일정 뉴스 영상: 유튜브 @parkgolfsegye 재생목록 "오늘일정 뉴스" (assets/newsvideo.json, GitHub Actions가 자동 갱신). 최신 영상이 맨 위.
(function(){
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function clean(t){ return String(t || '').replace(/^\[[^\]]*\]\s*/, ''); }
  function day(t){ var m = /(\d+)월\s*(\d+)일\(([^)]+)\)/.exec(t || ''); return m ? m[1] + '월 ' + m[2] + '일(' + m[3] + ')' : '오늘일정 뉴스'; }
  var box = document.getElementById('nv'), frame = document.getElementById('nv-frame'), now = document.getElementById('nv-now'), ul = document.getElementById('nv-list');
  function play(v, auto){
    frame.src = 'https://www.youtube-nocookie.com/embed/' + v.id + '?rel=0' + (auto ? '&autoplay=1' : '');
    now.textContent = clean(v.title);
    [].forEach.call(ul.children, function(li){ li.classList.toggle('on', li.getAttribute('data-id') === v.id); });
  }
  fetch('assets/newsvideo.json?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){
    var list = (d.videos || []).slice().sort(function(a, b){ return String(b.published).localeCompare(String(a.published)); }).slice(0, 30);
    if (!list.length) return;
    ul.innerHTML = list.map(function(v){
      return '<li class="nv-item" data-id="' + esc(v.id) + '"><img loading="lazy" src="https://i.ytimg.com/vi/' + esc(v.id) + '/mqdefault.jpg" alt="">' +
        '<div><span class="nv-d">' + esc(day(v.title)) + '</span><div class="nv-t">' + esc(clean(v.title)) + '</div></div></li>';
    }).join('');
    [].forEach.call(ul.children, function(li, i){ li.addEventListener('click', function(){ play(list[i], true); if (window.innerWidth <= 760) box.scrollIntoView({ behavior: 'smooth' }); }); });
    box.hidden = false; play(list[0], false);
  }).catch(function(){});
})();
</script>
</body>
</html>
