<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>입문강좌 - 파크골프세계</title>
<meta name="description" content="처음 시작하는 분을 위한 파크골프 입문강좌 영상 모음 (파크골프세계 유튜브)">
<meta property="og:site_name" content="파크골프세계">
<meta property="og:type" content="website">
<meta property="og:title" content="입문강좌 - 파크골프세계">
<meta property="og:description" content="처음 시작하는 분을 위한 파크골프 입문강좌">
<meta property="og:url" content="https://parkgolfsegye.co.kr/course.html">
<meta property="og:image" content="https://parkgolfsegye.co.kr/assets/img/og_link.jpg?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="600">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css?v=20261125s">
<style>
.course-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.course-yt{display:inline-block;padding:8px 14px;border-radius:8px;background:#e62117;color:#fff;font-weight:700;text-decoration:none;font-size:14px}
.course-player{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden;margin:14px 0 6px}
.course-player iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.course-now{font-weight:700;font-size:17px;margin:8px 0 18px}
.course-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.course-item{display:flex;gap:14px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.course-item:hover,.course-item.on{border-color:var(--main);background:#f1f8f4}
.course-item img{width:200px;max-width:42%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;flex:none;background:#ddd}
.course-no{display:inline-block;background:var(--main);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700;margin-bottom:6px}
.course-t{font-weight:700;font-size:16px;line-height:1.4}
.course-d{color:var(--sub);font-size:14px;line-height:1.5;margin-top:4px}
@media (max-width:600px){.course-item img{width:130px}.course-t{font-size:15px}.course-d{display:none}}
</style>
</head>
<body data-page="course" data-root="">
<div id="site-header"></div>
<main class="wrap">
  <div class="course-top">
    <h1>입문강좌</h1>
    <a class="course-yt" href="https://www.youtube.com/@parkgolfsegye">유튜브 채널 보기</a>
  </div>
  <p class="muted small">처음 시작하는 분을 위한 파크골프 입문 시리즈입니다. 먼저 만든 강좌부터 순서대로 보실 수 있습니다. 강좌를 누르면 위 화면에서 재생됩니다.</p>
  <div class="course-player"><iframe id="course-frame" title="입문강좌 영상" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
  <div class="course-now" id="course-now"></div>
  <ul class="course-list" id="course-list"><li class="muted">불러오는 중…</li></ul>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=20261124m"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js?v=20261127i"></script>
<script>
(function(){
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function epNo(t){ var m = /\[[^\]]*?(\d+)-(\d+)\]/.exec(t || ''); return m ? [+m[1], +m[2]] : null; }
  function cleanTitle(t){ return String(t || '').replace(/^\[[^\]]*\]\s*/, ''); }
  var frame = document.getElementById('course-frame'), now = document.getElementById('course-now'), ul = document.getElementById('course-list');
  function play(v, auto){
    frame.src = 'https://www.youtube-nocookie.com/embed/' + v.id + '?rel=0' + (auto ? '&autoplay=1' : '');
    var n = epNo(v.title); now.textContent = (n ? '입문 ' + n[0] + '-' + n[1] + '. ' : '') + cleanTitle(v.title);
    [].forEach.call(ul.children, function(li){ li.classList.toggle('on', li.getAttribute('data-id') === v.id); });
  }
  fetch('assets/course.json?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){
    // 처음 만든 강좌가 맨 위: 회차 번호(1-1, 1-2 …) 순, 번호가 없으면 올린 날짜 순
    var list = (d.videos || []).slice().sort(function(a, b){
      var x = epNo(a.title), y = epNo(b.title);
      if (x && y && (x[0] !== y[0] || x[1] !== y[1])) return x[0] - y[0] || x[1] - y[1];
      return String(a.published).localeCompare(String(b.published));
    });
    if (!list.length) { ul.innerHTML = '<li class="muted">아직 올라온 강좌가 없습니다.</li>'; return; }
    ul.innerHTML = list.map(function(v){ var n = epNo(v.title);
      return '<li class="course-item" data-id="' + esc(v.id) + '"><img loading="lazy" src="https://i.ytimg.com/vi/' + esc(v.id) + '/hqdefault.jpg" alt="">' +
        '<div><span class="course-no">' + (n ? '입문 ' + n[0] + '-' + n[1] : '입문강좌') + '</span><div class="course-t">' + esc(cleanTitle(v.title)) + '</div>' +
        (v.desc ? '<div class="course-d">' + esc(v.desc) + '</div>' : '') + '</div></li>';
    }).join('');
    [].forEach.call(ul.children, function(li, i){ li.addEventListener('click', function(){ play(list[i], true); window.scrollTo({ top: 0, behavior: 'smooth' }); }); });
    play(list[0], false);
  }).catch(function(){ ul.innerHTML = '<li class="muted">강좌 목록을 불러오지 못했습니다. <a href="https://www.youtube.com/@parkgolfsegye">유튜브 채널</a>에서 보실 수 있습니다.</li>'; });
})();
</script>
</body>
</html>
