<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 - 파크골프세계</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="login" data-root="">
<div id="site-header"></div>
<main class="wrap">
  <h1>로그인</h1>
    <form id="login-form" class="card form">
      <label>이메일 <input type="email" name="email" required autocomplete="email"></label>
      <label>비밀번호 <input type="password" name="password" required minlength="6" autocomplete="current-password"></label>
      <label class="signup-only">별명 <input type="text" name="nickname" maxlength="20"></label>
      <div class="row">
        <button type="submit" class="btn">로그인</button>
        <button type="button" class="btn line" id="toggle-signup">회원가입</button>
      </div>
      <p id="login-msg" class="muted"></p>
    </form>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
