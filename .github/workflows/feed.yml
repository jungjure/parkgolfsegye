name: RSS·사이트맵 갱신
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-feed.mjs
      - run: node scripts/build-course.mjs
      - run: |
          if [ -n "$(git status --porcelain rss.xml sitemap.xml assets/course.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add rss.xml sitemap.xml assets/course.json
            git commit -m "RSS·사이트맵·입문강좌 자동 갱신"
            git push
          fi
